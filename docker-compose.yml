# AyuAahar - local stack: Postgres + API (+ optional Vite dev server)
#   docker compose up --build            -> API on http://localhost:5000
#   docker compose --profile web up      -> also the frontend on http://localhost:5173
services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: portfolio
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d portfolio"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: .
    # GROQ_API_KEY (and any other local overrides) come from the gitignored backend/.env
    env_file:
      - path: backend/.env
        required: false
    environment:
      DATABASE_URL: postgresql://postgres:postgres@db:5432/portfolio
      DB_SCHEMA: ayuadhar
      JWT_SECRET: local-docker-secret-change-me-please-32b
      FRONTEND_URL: http://localhost:5173
      APP_ENV: development
      PORT: "5000"
    ports:
      - "5000:5000"
    depends_on:
      db:
        condition: service_healthy

  frontend:
    profiles: ["web"]
    image: node:22-alpine
    working_dir: /app
    command: sh -c "npm ci && npm run dev -- --host 0.0.0.0 --port 5173"
    environment:
      VITE_API_URL: http://localhost:5000/api
    volumes:
      - ./frontend/app:/app
      - /app/node_modules
    ports:
      - "5173:5173"
    depends_on:
      - backend

volumes:
  postgres_data:
